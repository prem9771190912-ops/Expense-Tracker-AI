<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="card login-panel">
      <div class="login-mark">⚡</div>
      <h1>Create Account</h1>
      <p class="login-subtitle">Start tracking your expenses</p>

      <form id="signupForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" type="text" placeholder="Your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" minlength="6" placeholder="At least 6 characters" required>
        </div>

        <button type="submit" style="margin-top: 6px;">Sign Up</button>
      </form>

      <div class="auth-links">
        <p style="color: var(--text-secondary); margin-bottom: 4px;">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </div>

      <p id="message"></p>
    </div>
  </main>

  <script src="js/signup.js"></script>
</body>
</html>
