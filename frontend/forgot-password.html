<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — SpendWise AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <div class="card login-panel">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
        <div class="login-mark" style="margin-bottom: 0;">🔑</div>
        <a href="login.html" class="nav-item" style="font-size: 0.8rem;">← Back to Login</a>
      </div>

      <span class="eyebrow">Recovery</span>
      <h1>Forgot Password</h1>
      <p class="login-subtitle">Enter your registered email address below to receive password recovery instructions.</p>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label for="email">Account Email</label>
          <input id="email" type="email" placeholder="name@example.com" required>
        </div>

        <button type="submit" style="margin-top: 6px;">Send Reset Link</button>
      </form>

      <div class="auth-links">
        <p style="color: var(--text-secondary); margin-bottom: 4px;">
          Remembered your password? <a href="login.html">Return to login</a>
        </p>
      </div>

      <p id="message"></p>
    </div>
  <!-- Axios for API calls -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
