<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Expense Tracker — SpendWise AI</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- React 18 Production UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body>
  <div id="root">
    <div style="min-height: 80vh; display: grid; place-items: center; color: var(--text-secondary);">
      <div style="text-align: center;">
        <div class="brand-icon" style="margin: 0 auto 16px; font-size: 1.4rem;">⚛️</div>
        <p style="font-size: 1.1rem; font-weight: 600; color: var(--text-primary);">Loading SpendWise React App...</p>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Initializing state and paginated ledger</p>
      </div>
    </div>
  </div>

  <!-- Pure React 18 Application Script -->
  <script src="js/react-app.js"></script>
</body>
</html>
