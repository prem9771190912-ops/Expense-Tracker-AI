<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — SpendWise AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <div class="card login-panel">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
        <div class="login-mark" style="margin-bottom: 0;">🔒</div>
        <a href="login.html" class="nav-item" style="font-size: 0.8rem;">← Back to Login</a>
      </div>

      <span class="eyebrow">Security</span>
      <h1>Set New Password</h1>
      <p class="login-subtitle">Please enter a new, secure password for your account (minimum 6 characters).</p>

      <form id="resetPasswordForm">
        <div class="form-group">
          <label for="password">New Password</label>
          <input id="password" type="password" minlength="6" placeholder="Enter new password" required>
        </div>

        <button type="submit" style="margin-top: 6px;">Update Password</button>
      </form>

      <div class="auth-links">
        <p style="color: var(--text-secondary); margin-bottom: 4px;">
          Back to <a href="login.html">Sign In</a>
        </p>
      </div>

      <p id="message"></p>
    </div>
  </main>

  <script src="js/reset-password.js"></script>
</body>
</html>
